services:
  - type: web
    name: acousticsense-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: GROQ_API_KEY
        sync: false
